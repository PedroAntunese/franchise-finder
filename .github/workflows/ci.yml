name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Mesmas versões usadas pelo time. Se mudar aqui, atualize o README.
env:
  NODE_VERSION: 26
  NPM_VERSION: 12.2.1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # MySQL vazio, criado só para testar as migrations. Nunca usa o banco do Aiven.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: franchise_finder_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Usar a mesma versão do npm do time
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe de todos os arquivos
        run: find src migrations knexfile.js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Verificar imports
        run: node -e "import('./src/app.js').then(() => { console.log('imports ok'); process.exit(0); }).catch((e) => { console.error(e); process.exit(1); })"

      - name: Aplicar migrations num banco vazio
        env: &mysql-ci
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ci
          DB_NAME: franchise_finder_ci
        run: |
          npm run migrate
          npm run migrate:status

      - name: Conferir tabelas criadas
        env: *mysql-ci
        run: |
          node --input-type=module -e "
          import db from './src/config/db.js';
          const esperadas = ['usuarios', 'franquias', 'franqueados'];
          const [linhas] = await db.query('SELECT table_name AS nome FROM information_schema.tables WHERE table_schema = DATABASE()');
          const existentes = linhas.map((l) => l.nome);
          const faltando = esperadas.filter((t) => !existentes.includes(t));
          await db.end();
          if (faltando.length) { console.error('Tabelas faltando:', faltando.join(', ')); process.exit(1); }
          console.log('Tabelas ok:', esperadas.join(', '));
          "

      - name: Desfazer e reaplicar migrations
        env: *mysql-ci
        run: |
          npm run migrate:rollback
          npm run migrate

      - name: Gerar imagem Docker
        run: docker build -t franchise-finder-backend:ci .

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Usar a mesma versão do npm do time
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

      - name: Gerar build
        run: npm run build
        env:
          CI: true
